<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COCOFUZ Business Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #059669; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- FIREBASE SETUP ---
        const firebaseConfig = {
            apiKey: "AIzaSyCBvtj42uBZDY2jdLCuOvMwVUWbDZzT5LU",
            authDomain: "cocofuz-3d9f2.firebaseapp.com",
            projectId: "cocofuz-3d9f2",
            storageBucket: "cocofuz-3d9f2.firebasestorage.app",
            messagingSenderId: "279016644214",
            appId: "1:279016644214:web:f887520d1f7f4168fd8957",
            measurementId: "G-4260QH950N"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();
        // ----------------------

        // --- LOGIN & SIGNUP COMPONENT ---
        const LoginScreen = () => {
            const [isSignUp, setIsSignUp] = useState(false);
            const [name, setName] = useState('');
            const [mobile, setMobile] = useState('');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            const handleGoogleLogin = async () => {
                setIsLoading(true); setError('');
                try { await auth.signInWithPopup(googleProvider); } 
                catch (err) { setError(err.message); setIsLoading(false); }
            };

            const handleEmailAuth = async (e) => {
                e.preventDefault();
                setIsLoading(true); setError('');
                try {
                    if (isSignUp) {
                        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                        await userCredential.user.updateProfile({ displayName: name });
                        await db.collection("users").doc(userCredential.user.uid).set({
                            name: name,
                            email: email,
                            mobile: mobile,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                    }
                } catch (err) {
                    setError(err.message);
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-emerald-800 to-emerald-950 flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8 animate-fade-in">
                        <div className="flex flex-col items-center mb-6">
                            <div className="relative w-20 h-20 mb-4 bg-white rounded-full">
                               <img src="logo.jpg" alt="COCOFUZ Logo" className="w-full h-full object-cover rounded-full shadow-xl border-4 border-emerald-100" onError={(e) => { e.target.style.display = 'none'; document.getElementById('fallback-logo-login').style.display = 'flex'; }} />
                               <div id="fallback-logo-login" className="hidden absolute inset-0 bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-full flex items-center justify-center shadow-xl"><i className="fa-solid fa-droplet text-white text-3xl"></i></div>
                            </div>
                            <h1 className="text-2xl font-black text-emerald-800 tracking-tight">COCOFUZ</h1>
                            <p className="text-xs font-bold text-gray-400 uppercase tracking-widest mt-1">{isSignUp ? 'Create Account' : 'Business Portal'}</p>
                        </div>
                        
                        {error && <div className="bg-red-50 text-red-600 p-3 mb-4 rounded-xl text-sm text-center font-semibold border border-red-200"><i className="fa-solid fa-circle-exclamation mr-2"></i> {error}</div>}
                        
                        <form onSubmit={handleEmailAuth} className="space-y-4">
                            {isSignUp && (
                                <>
                                    <div className="relative">
                                        <i className="fa-solid fa-user absolute left-4 top-3.5 text-gray-400"></i>
                                        <input type="text" value={name} onChange={e => setName(e.target.value)} required className="w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:border-emerald-500 focus:ring-0 outline-none transition text-sm" placeholder="Full Name" />
                                    </div>
                                    <div className="relative">
                                        <i className="fa-solid fa-phone absolute left-4 top-3.5 text-gray-400"></i>
                                        <input type="tel" value={mobile} onChange={e => setMobile(e.target.value)} required className="w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:border-emerald-500 focus:ring-0 outline-none transition text-sm" placeholder="Mobile Number" />
                                    </div>
                                </>
                            )}
                            <div className="relative">
                                <i className="fa-solid fa-envelope absolute left-4 top-3.5 text-gray-400"></i>
                                <input type="email" value={email} onChange={e => setEmail(e.target.value)} required className="w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:border-emerald-500 focus:ring-0 outline-none transition text-sm" placeholder="Email Address" />
                            </div>
                            <div className="relative">
                                <i className="fa-solid fa-lock absolute left-4 top-3.5 text-gray-400"></i>
                                <input type="password" value={password} onChange={e => setPassword(e.target.value)} required className="w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:border-emerald-500 focus:ring-0 outline-none transition text-sm" placeholder="Password (min 6 chars)" />
                            </div>
                            
                            <button type="submit" disabled={isLoading} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-emerald-200 mt-2 flex justify-center items-center disabled:opacity-70">
                                {isLoading ? <i className="fa-solid fa-spinner fa-spin"></i> : (isSignUp ? 'Create Account' : 'Secure Login')}
                            </button>
                        </form>

                        <div className="mt-6 flex items-center justify-center space-x-4">
                            <hr className="w-full border-gray-200" />
                            <span className="text-xs font-bold text-gray-400 uppercase">OR</span>
                            <hr className="w-full border-gray-200" />
                        </div>

                        <button onClick={handleGoogleLogin} disabled={isLoading} className="w-full mt-6 bg-white border-2 border-gray-200 hover:bg-gray-50 text-gray-700 font-bold py-3 px-4 rounded-xl transition flex items-center justify-center text-sm disabled:opacity-70">
                            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-5 h-5 mr-3" alt="Google logo" /> Sign in with Google
                        </button>

                        <p className="text-center text-sm text-gray-500 mt-6">
                            {isSignUp ? "Already have an account?" : "Don't have an account?"} 
                            <button onClick={() => { setIsSignUp(!isSignUp); setError(''); }} className="text-emerald-600 font-bold ml-2 hover:underline">
                                {isSignUp ? "Login here" : "Sign up"}
                            </button>
                        </p>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [isCheckingAuth, setIsCheckingAuth] = useState(true);
            const [currentUser, setCurrentUser] = useState(null);
            
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [dashboardMonth, setDashboardMonth] = useState(new Date().toISOString().substring(0, 7));
            
            // --- DATE RANGE STATES FOR REPORTS (Default to current month to today) ---
            const today = new Date();
            const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
            
            const [reportFromDate, setReportFromDate] = useState(firstDayOfMonth.toISOString().split('T')[0]);
            const [reportToDate, setReportToDate] = useState(today.toISOString().split('T')[0]);

            // --- FULLY CLOUD-SYNCED DATA STATES ---
            const [purchases, setPurchases] = useState([]);
            const [production, setProduction] = useState([]); 
            const [transfers, setTransfers] = useState([]);
            const [sales, setSales] = useState([]); 
            const [expenses, setExpenses] = useState([]);
            const [assets, setAssets] = useState([]); 
            const [payments, setPayments] = useState([]); 
            
            const [monthlyTarget, setMonthlyTarget] = useState(150000); 
            const [isEditingTarget, setIsEditingTarget] = useState(false);
            const [tempTargetValue, setTempTargetValue] = useState("");

            const [saleEntry, setSaleEntry] = useState({ date: new Date().toISOString().split('T')[0], soldQty: '', saleValue: '', commission: '' });
            const [paymentEntry, setPaymentEntry] = useState({ date: new Date().toISOString().split('T')[0], month: new Date().toISOString().substring(0, 7), saleQty: '', totalAmount: '', netSale: '', receivedAmount: '', notes: '' });

            const [aiInsights, setAiInsights] = useState(null);
            const [isGeneratingInsights, setIsGeneratingInsights] = useState(false);
            const [marketingCopy, setMarketingCopy] = useState(null);
            const [isGeneratingCopy, setIsGeneratingCopy] = useState(false);
            const [negotiationDraft, setNegotiationDraft] = useState("");
            const [isGeneratingNegotiation, setIsGeneratingNegotiation] = useState(false);
            const [expenseAudit, setExpenseAudit] = useState("");
            const [isGeneratingAudit, setIsGeneratingAudit] = useState(false);
            const [salesCoachTip, setSalesCoachTip] = useState("");
            const [isGeneratingSalesCoach, setIsGeneratingSalesCoach] = useState(false);
            const [isPdfGenerating, setIsPdfGenerating] = useState(false);

            // --- 1. FIREBASE AUTHENTICATION LISTENER ---
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    if (user) {
                        setCurrentUser(user);
                        setIsLoggedIn(true);
                    } else {
                        setCurrentUser(null);
                        setIsLoggedIn(false);
                    }
                    setIsCheckingAuth(false);
                });
                return () => unsubscribe(); 
            }, []);

            // --- 2. FIREBASE REAL-TIME CLOUD LISTENERS (SYNC EVERYTHING) ---
            useEffect(() => {
                if (!isLoggedIn) return;

                const syncCollection = (collectionName, stateSetter) => {
                    return db.collection(collectionName)
                             .orderBy("timestamp", "desc")
                             .onSnapshot((snapshot) => {
                                 const data = [];
                                 snapshot.forEach(doc => data.push({ id: doc.id, ...doc.data() }));
                                 stateSetter(data);
                             }, (err) => console.error(`Error syncing ${collectionName}:`, err));
                };

                const unsubSales = syncCollection("sales", setSales);
                const unsubPurchases = syncCollection("purchases", setPurchases);
                const unsubProduction = syncCollection("production", setProduction);
                const unsubTransfers = syncCollection("transfers", setTransfers);
                const unsubExpenses = syncCollection("expenses", setExpenses);
                const unsubAssets = syncCollection("assets", setAssets);
                const unsubPayments = syncCollection("payments", setPayments);

                return () => {
                    unsubSales(); unsubPurchases(); unsubProduction();
                    unsubTransfers(); unsubExpenses(); unsubAssets(); unsubPayments();
                };
            }, [isLoggedIn]);

            const handleLogout = () => auth.signOut().catch(error => console.error("Error signing out: ", error));

            // --- GLOBAL CLOUD DELETE FUNCTION ---
            const deleteFromCloud = async (collectionName, id) => {
                try { await db.collection(collectionName).doc(id).delete(); } 
                catch (error) { alert("Failed to delete from cloud."); }
            };

            // --- INPUT HANDLERS WITH AUTOMATIC FORMULAS ---
            const handleSaleQtyChange = (e) => {
                const qty = e.target.value;
                const qtyNum = Number(qty);
                // Automatically calculate gross sale (Qty * 100) and commission (Qty * 25)
                setSaleEntry({ 
                    ...saleEntry, 
                    soldQty: qty, 
                    saleValue: qtyNum > 0 ? qtyNum * 100 : '', 
                    commission: qtyNum > 0 ? qtyNum * 25 : '' 
                });
            };
            
            const handleSaleInputChange = (e) => setSaleEntry({ ...saleEntry, [e.target.name]: e.target.value });

            // --- CLOUD ADD FUNCTIONS ---
            const handleAddSale = async (e) => {
                e.preventDefault();
                const newSale = { 
                    date: saleEntry.date, 
                    soldQty: Number(saleEntry.soldQty), 
                    saleValue: Number(saleEntry.saleValue), 
                    commission: Number(saleEntry.commission) || 0,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    userEmail: currentUser?.email || currentUser?.displayName
                };
                try {
                    await db.collection("sales").add(newSale);
                    setSaleEntry({ date: new Date().toISOString().split('T')[0], soldQty: '', saleValue: '', commission: '' });
                } catch (err) { alert("Failed to save. Check internet connection."); }
            };

            const handleAddPurchase = async (e) => {
              e.preventDefault();
              const formData = new FormData(e.target);
              const qty = Number(formData.get('quantity'));
              const rate = Number(formData.get('rate'));
              const transport = Number(formData.get('transportCost')) || 0;
              const totalCost = (qty * rate) + transport;
              const landingPrice = (totalCost / qty).toFixed(2);
              try {
                  await db.collection("purchases").add({
                      date: formData.get('date'), supplier: formData.get('supplier'), quantity: qty,
                      rate: rate, transportCost: transport, totalCost: totalCost, landingPrice: Number(landingPrice),
                      timestamp: firebase.firestore.FieldValue.serverTimestamp()
                  });
                  e.target.reset();
              } catch (err) { alert("Failed to save to cloud."); }
            };

            const handleAddProduction = async (e) => {
              e.preventDefault();
              const formData = new FormData(e.target);
              try {
                  await db.collection("production").add({
                      date: formData.get('date'), raw: Number(formData.get('raw')), peeled: Number(formData.get('peeled')),
                      waste: Number(formData.get('waste')), notes: formData.get('notes'), timestamp: firebase.firestore.FieldValue.serverTimestamp()
                  });
                  e.target.reset();
              } catch (err) { alert("Failed to log production."); }
            };

            const handleAddTransfer = async (e) => {
              e.preventDefault();
              const formData = new FormData(e.target);
              try {
                  await db.collection("transfers").add({
                      date: formData.get('date'), destination: formData.get('destination'),
                      quantity: Number(formData.get('quantity')), transportCost: Number(formData.get('transportCost') || 0),
                      timestamp: firebase.firestore.FieldValue.serverTimestamp()
                  });
                  e.target.reset();
              } catch (err) { alert("Failed to log transfer."); }
            };

            const handleAddExpense = async (e) => {
              e.preventDefault();
              const formData = new FormData(e.target);
              try {
                  await db.collection("expenses").add({
                      date: formData.get('date'), category: formData.get('category'),
                      amount: Number(formData.get('amount')), notes: formData.get('notes'),
                      timestamp: firebase.firestore.FieldValue.serverTimestamp()
                  });
                  e.target.reset();
              } catch (err) { alert("Failed to save expense."); }
            };

            const handleAddAsset = async (e) => {
              e.preventDefault();
              const formData = new FormData(e.target);
              try {
                  await db.collection("assets").add({
                      date: formData.get('date'), name: formData.get('name'),
                      cost: Number(formData.get('cost')), supplier: formData.get('supplier'),
                      timestamp: firebase.firestore.FieldValue.serverTimestamp()
                  });
                  e.target.reset();
              } catch (err) { alert("Failed to save asset."); }
            };

            const handlePaymentQtyChange = (e) => {
              const qtyNum = Number(e.target.value);
              const totalAmount = qtyNum > 0 ? qtyNum * 100 : '';
              const netSale = qtyNum > 0 ? totalAmount * 0.75 : ''; 
              setPaymentEntry({ ...paymentEntry, saleQty: e.target.value, totalAmount: totalAmount, netSale: netSale });
            };

            const handlePaymentInputChange = (e) => setPaymentEntry({ ...paymentEntry, [e.target.name]: e.target.value });

            const handleAddPayment = async (e) => {
              e.preventDefault();
              const total = Number(paymentEntry.totalAmount);
              const net = Number(paymentEntry.netSale);
              const received = Number(paymentEntry.receivedAmount);
              try {
                  await db.collection("payments").add({
                      date: paymentEntry.date, month: paymentEntry.month, saleQty: Number(paymentEntry.saleQty),
                      totalAmount: total, netSale: net, receivedAmount: received, pendingAmount: total - received,
                      notes: paymentEntry.notes, timestamp: firebase.firestore.FieldValue.serverTimestamp()
                  });
                  setPaymentEntry({ date: new Date().toISOString().split('T')[0], month: new Date().toISOString().substring(0, 7), saleQty: '', totalAmount: '', netSale: '', receivedAmount: '', notes: '' });
              } catch (err) { alert("Failed to save payment status."); }
            };

            // --- CALCULATIONS (MONTHLY FILTERING LOGIC) ---
            const stats = useMemo(() => {
              const totalPurchased = purchases.reduce((sum, p) => sum + p.quantity, 0);
              const totalTransferred = transfers.reduce((sum, t) => sum + t.quantity, 0);
              const totalSold = sales.reduce((sum, s) => sum + s.soldQty, 0);
              
              const godownStock = totalPurchased - totalTransferred;
              const storeStock = totalTransferred - totalSold;

              const totalStockCost = purchases.reduce((sum, p) => sum + p.totalCost, 0);
              const totalGodownTransportCost = purchases.reduce((sum, p) => sum + p.transportCost, 0);

              const monthlySalesList = sales.filter(s => s.date && s.date.startsWith(dashboardMonth));
              const selectedMonthGrossSale = monthlySalesList.reduce((sum, s) => sum + s.saleValue, 0);
              
              // Total sold in selected month
              const totalSoldInMonth = monthlySalesList.reduce((sum, s) => sum + s.soldQty, 0);

              const dailySalesMap = {};
              monthlySalesList.forEach(s => {
                const safeDate = s.date;
                if (!dailySalesMap[safeDate]) { dailySalesMap[safeDate] = { date: safeDate, qty: 0, value: 0, commission: 0 }; }
                dailySalesMap[safeDate].qty += s.soldQty;
                dailySalesMap[safeDate].value += s.saleValue;
                dailySalesMap[safeDate].commission += (s.commission || 0);
              });
              
              const filteredDayWiseSales = Object.values(dailySalesMap).map(d => ({ ...d, netSale: d.value - d.commission })).sort((a, b) => b.date.localeCompare(a.date));

              let dayHigh = { qty: 0, date: '-' };
              let dayLow = { qty: 0, date: '-' };
              
              if (filteredDayWiseSales.length > 0) {
                dayHigh = filteredDayWiseSales.reduce((max, current) => current.qty > max.qty ? current : max, filteredDayWiseSales[0]);
                dayLow = filteredDayWiseSales.reduce((min, current) => current.qty < min.qty ? current : min, filteredDayWiseSales[0]);
              }

              const avgDailySales = filteredDayWiseSales.length ? Math.round(totalSoldInMonth / filteredDayWiseSales.length) : 0;

              const monthlyData = {};
              const initMonth = (dateStr) => {
                  if (!dateStr) return 'Unknown';
                  const month = dateStr.substring(0, 7);
                  if (!monthlyData[month]) { monthlyData[month] = { month, grossSale: 0, commission: 0, expenses: 0 }; }
                  return month;
              };

              sales.forEach(s => { const m = initMonth(s.date); if (m !== 'Unknown') { monthlyData[m].grossSale += s.saleValue; monthlyData[m].commission += (s.commission || 0); }});
              expenses.forEach(e => { const m = initMonth(e.date); if (m !== 'Unknown') monthlyData[m].expenses += e.amount; });
              purchases.forEach(p => { const m = initMonth(p.date); if (m !== 'Unknown') monthlyData[m].expenses += p.totalCost; });
              transfers.forEach(t => { const m = initMonth(t.date); if (m !== 'Unknown') monthlyData[m].expenses += t.transportCost; });

              const monthlyReport = Object.values(monthlyData).map(data => {
                  const netSale = data.grossSale - data.commission;
                  const netProfit = netSale - data.expenses;
                  return { ...data, netSale, netProfit };
              }).sort((a, b) => b.month.localeCompare(a.month));

              const targetAchievedPercent = monthlyTarget > 0 ? Math.min(100, Math.round((selectedMonthGrossSale / monthlyTarget) * 100)) : 0;

              return { 
                godownStock, storeStock, totalStockCost, totalGodownTransportCost,
                selectedMonthGrossSale, targetAchievedPercent, totalSoldInMonth,
                avgDailySales, dayHigh, dayLow, filteredDayWiseSales, 
                monthlyReport
              };
            }, [purchases, transfers, sales, expenses, assets, monthlyTarget, dashboardMonth]);

            const handleDownloadPDF = () => {
                setIsPdfGenerating(true);
                const element = document.getElementById('pdf-report-content');
                const opt = { margin: 0.4, filename: `COCOFUZ_Report_${dashboardMonth}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } };
                html2pdf().set(opt).from(element).save().then(() => setIsPdfGenerating(false));
            };

            const callGeminiAPI = async (prompt, systemInstruction) => {
              const apiKey = "YOUR_GEMINI_API_KEY_HERE"; 
              const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
              const payload = { contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: systemInstruction }] } };
              const attemptFetch = async (retries = 3, delay = 1000) => {
                try {
                  const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                  if (!response.ok) throw new Error(`API Error`);
                  const data = await response.json();
                  return data.candidates?.[0]?.content?.parts?.[0]?.text || "No insights generated.";
                } catch (error) {
                  if (retries > 0) { await new Promise(resolve => setTimeout(resolve, delay)); return attemptFetch(retries - 1, delay * 2); }
                  throw new Error("Failed to connect to AI.");
                }
              };
              return attemptFetch();
            };

            const handleGenerateInsights = async () => {
              setIsGeneratingInsights(true);
              try {
                const prompt = `Analyze COCOFUZ tender coconut data for the month of ${dashboardMonth}:\n- Godown Stock: ${stats.godownStock}\n- Store Stock: ${stats.storeStock}\n- Avg Daily Sales This Month: ${stats.avgDailySales}/day\n- Month Gross Revenue: ₹${stats.selectedMonthGrossSale} against Target ₹${monthlyTarget} (${stats.targetAchievedPercent}%)\nProvide exactly 3 short, highly actionable bullet points of business advice. Keep it under 80 words.`;
                const response = await callGeminiAPI(prompt, "You are a sharp retail business consultant helping a coconut brand owner optimize their operations.");
                setAiInsights(response);
              } catch (error) { setAiInsights("Failed to generate insights."); }
              setIsGeneratingInsights(false);
            };

            const handleGenerateMarketing = async (e) => {
              e.preventDefault();
              setIsGeneratingCopy(true);
              try {
                const topic = new FormData(e.target).get('topic');
                const prompt = `Write a catchy social media post for Instagram/Facebook about: "${topic}". Our business is COCOFUZ, a premium tender coconut brand. Include emojis and hashtags.`;
                const response = await callGeminiAPI(prompt, "You are a creative social media manager.");
                setMarketingCopy(response);
              } catch (error) { setMarketingCopy("Failed to generate copy."); }
              setIsGeneratingCopy(false);
            };

            const handleGenerateNegotiation = async () => {
              if (purchases.length === 0) { setNegotiationDraft("⚠️ Please add at least one stock purchase first."); return; }
              setIsGeneratingNegotiation(true);
              const latest = purchases[0];

                              <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Sale Qty</label><input type="number" name="saleQty" value={paymentEntry.saleQty} onChange={handlePaymentQtyChange} required className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none" placeholder="e.g. 500" /></div>
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Total (₹)</label><input type="number" name="totalAmount" value={paymentEntry.totalAmount} onChange={handlePaymentInputChange} required className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none bg-gray-50" /></div>
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Net Sale</label><input type="number" name="netSale" value={paymentEntry.netSale} onChange={handlePaymentInputChange} required className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none bg-gray-50" /></div>
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Received</label><input type="number" name="receivedAmount" value={paymentEntry.receivedAmount} onChange={handlePaymentInputChange} required className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none" /></div>
                              </div>
                              <div><label className="block text-sm font-medium text-gray-700 mb-1">Remarks</label><input type="text" name="notes" value={paymentEntry.notes} onChange={handlePaymentInputChange} className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none" /></div>
                              <button type="submit" className="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded-lg transition shadow-md">Log Payment Status</button>
                            </form>
                          </div>
                      </div>

                      <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mt-6">
                         <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center text-indigo-600"><i className="fa-solid fa-chair mr-2"></i> Register New Physical Asset</h3>
                         <form onSubmit={handleAddAsset} className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4 items-end">
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Purchase Date</label><input type="date" name="date" required className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" /></div>
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Item Name</label><input type="text" name="name" required placeholder="e.g. Sharp Knives" className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" /></div>
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Cost (₹)</label><input type="number" name="cost" required min="1" className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" /></div>
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Supplier</label><input type="text" name="supplier" className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" /></div>
                            <div className="sm:col-span-2 md:col-span-1"><button type="submit" className="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg transition shadow-md">Register Asset</button></div>
                         </form>
                      </div>

                      <div className="grid grid-cols-1 gap-6 mt-6">
                          <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                              <h4 className="p-4 bg-teal-50 border-b border-teal-100 font-bold text-teal-900 uppercase text-xs tracking-widest"><i className="fa-solid fa-list-ul mr-2"></i> Payment Tracking History</h4>
                              <div className="overflow-x-auto max-h-64 overflow-y-auto">
                                  <table className="w-full text-left border-collapse min-w-max">
                                      <thead className="bg-gray-50 sticky top-0 shadow-sm text-xs text-gray-500 uppercase">
                                          <tr><th className="p-3">Month</th><th className="p-3">Date</th><th className="p-3">Qty</th><th className="p-3">Total</th><th className="p-3 text-blue-600">Net Sale</th><th className="p-3 text-emerald-600">Received</th><th className="p-3 text-red-500">Pending</th><th className="p-3 text-right">Del</th></tr>
                                      </thead>
                                      <tbody className="divide-y divide-gray-100">
                                          {payments.map(p => (
                                              <tr key={p.id} className="hover:bg-gray-50 text-sm">
                                                  <td className="p-3 font-bold">{p.month}</td>
                                                  <td className="p-3 text-gray-600">{formatDate(p.date)}</td>
                                                  <td className="p-3 font-medium text-gray-800">{p.saleQty} pcs</td>
                                                  <td className="p-3 font-medium text-gray-800">₹{p.totalAmount?.toLocaleString()}</td>
                                                  <td className="p-3 font-bold text-blue-600">₹{p.netSale ? p.netSale.toLocaleString() : (p.totalAmount * 0.75).toLocaleString()}</td>
                                                  <td className="p-3 font-bold text-emerald-600">₹{p.receivedAmount?.toLocaleString()}</td>
                                                  <td className="p-3 font-bold text-red-500">₹{p.pendingAmount?.toLocaleString()}</td>
                                                  <td className="p-3 text-right"><button onClick={() => deleteFromCloud("payments", p.id)} className="text-red-400 hover:text-red-600"><i className="fa-solid fa-trash"></i></button></td>
                                              </tr>
                                          ))}
                                          {payments.length === 0 && <tr><td colSpan="8" className="p-4 text-center text-gray-500 text-sm">No payment records added</td></tr>}
                                      </tbody>
                                  </table>
                              </div>
                          </div>

                          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                                <h4 className="p-4 bg-red-50 border-b border-red-100 font-bold text-red-900 uppercase text-xs tracking-widest"><i className="fa-solid fa-list-ul mr-2"></i> Operating Expenses</h4>
                                <div className="flex-1 max-h-64 overflow-x-auto overflow-y-auto">
                                    <table className="w-full text-left border-collapse min-w-max">
                                        <thead className="bg-gray-50 sticky top-0 shadow-sm text-xs text-gray-500 uppercase"><tr><th className="p-3">Date</th><th className="p-3">Type</th><th className="p-3">Amount</th><th className="p-3 text-right">Del</th></tr></thead>
                                        <tbody className="divide-y divide-gray-100">
                                          {expenses.map(e => (
                                              <tr key={e.id} className="hover:bg-gray-50 text-sm">
                                                <td className="p-3 text-gray-600">{formatDate(e.date)}</td><td className="p-3 font-medium">{e.category}</td><td className="p-3 font-bold text-red-600">₹{e.amount}</td>
                                                <td className="p-3 text-right"><button onClick={() => deleteFromCloud("expenses", e.id)} className="text-red-400 hover:text-red-600"><i className="fa-solid fa-trash"></i></button></td>
                                              </tr>
                                          ))}
                                          {expenses.length === 0 && <tr><td colSpan="4" className="p-4 text-center text-gray-500 text-sm">No expenses</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                                <h4 className="p-4 bg-indigo-50 border-b border-indigo-100 font-bold text-indigo-900 uppercase text-xs tracking-widest"><i className="fa-solid fa-list-ul mr-2"></i> Physical Assets</h4>
                                <div className="flex-1 max-h-64 overflow-x-auto overflow-y-auto">
                                    <table className="w-full text-left border-collapse min-w-max">
                                        <thead className="bg-gray-50 sticky top-0 shadow-sm text-xs text-gray-500 uppercase"><tr><th className="p-3">Date</th><th className="p-3">Item</th><th className="p-3">Cost</th><th className="p-3 text-right">Del</th></tr></thead>
                                        <tbody className="divide-y divide-gray-100">
                                          {assets.map(a => (
                                              <tr key={a.id} className="hover:bg-gray-50 text-sm">
                                                <td className="p-3 text-gray-600">{formatDate(a.date)}</td><td className="p-3 font-medium text-indigo-800">{a.name}</td><td className="p-3 font-bold text-indigo-600">₹{a.cost}</td>
                                                <td className="p-3 text-right"><button onClick={() => deleteFromCloud("assets", a.id)} className="text-red-400 hover:text-red-600"><i className="fa-solid fa-trash"></i></button></td>
                                              </tr>
                                          ))}
                                          {assets.length === 0 && <tr><td colSpan="4" className="p-4 text-center text-gray-500 text-sm">No assets registered</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                          </div>
                          
                          <div className="bg-red-50 p-6 rounded-2xl shadow-sm border border-red-200 mt-6">
                             <div className="flex flex-col md:flex-row gap-4 justify-between items-start md:items-center">
                               <div>
                                 <h3 className="text-lg font-bold text-red-900 flex items-center"><i className="fa-solid fa-wand-magic-sparkles mr-2 text-red-500"></i> AI Expense Auditor</h3>
                                 <p className="text-sm text-red-700">Analyze spending and suggest ways to cut costs.</p>
                               </div>
                               <button onClick={handleAuditExpenses} disabled={isGeneratingAudit} className="w-full sm:w-auto bg-white text-red-700 font-bold py-2 px-4 rounded-xl shadow border border-red-200 hover:bg-red-100 transition whitespace-nowrap justify-center flex items-center">
                                 {isGeneratingAudit ? <i className="fa-solid fa-spinner fa-spin mr-2"></i> : '✨ '} Audit Expenses
                               </button>
                             </div>
                             {expenseAudit && <div className="bg-white p-4 mt-4 rounded-xl border border-red-200 text-sm whitespace-pre-wrap">{expenseAudit}</div>}
                          </div>
                      </div>
                    </div>
                  )}

                  {/* AI MARKETING VIEW */}
                  {activeTab === 'marketing' && (
                    <div className="space-y-6 animate-fade-in">
                       <header><h2 className="text-3xl font-bold text-gray-800 flex items-center"><i className="fa-solid fa-wand-magic-sparkles text-emerald-500 mr-3"></i> AI Marketing Hub</h2></header>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                          <h3 className="text-lg font-bold text-gray-800 mb-4">What do you want to promote?</h3>
                          <form onSubmit={handleGenerateMarketing} className="space-y-4">
                            <textarea name="topic" rows="4" required className="w-full border border-gray-300 rounded-lg p-3 outline-none resize-none focus:ring-2 focus:ring-emerald-500" placeholder="e.g., 'Fresh stock just arrived!'"></textarea>
                            <button type="submit" disabled={isGeneratingCopy} className="w-full bg-gradient-to-r from-emerald-500 to-emerald-600 text-white font-bold py-3 px-4 rounded-xl flex justify-center items-center shadow-md disabled:opacity-70">
                              {isGeneratingCopy ? <i className="fa-solid fa-spinner fa-spin mr-2"></i> : <i className="fa-solid fa-wand-magic-sparkles mr-2"></i>} Generate Post
                            </button>
                          </form>
                        </div>

                        <div className="bg-emerald-50 p-6 rounded-2xl shadow-sm border border-emerald-200 flex flex-col">
                          <h3 className="text-lg font-bold text-emerald-900 mb-4 flex items-center"><i className="fa-solid fa-comment mr-2"></i> Generated Copy</h3>
                          <div className="flex-1 bg-white rounded-xl border border-emerald-100 p-4 overflow-y-auto">
                            {marketingCopy ? <div className="text-gray-700 whitespace-pre-wrap font-medium">{marketingCopy}</div> : <div className="h-full flex flex-col items-center justify-center text-emerald-400 text-center py-6"><i className="fa-solid fa-wand-magic-sparkles text-4xl opacity-50 mb-3"></i><p className="text-sm">Post will appear here.</p></div>}
                          </div>
                        </div>
                      </div>

                      <div className="bg-amber-50 p-6 rounded-2xl shadow-sm border border-amber-200 mt-6">
                         <div className="flex flex-col md:flex-row gap-4 justify-between items-start md:items-center">
                           <div>
                             <h3 className="text-lg font-bold text-amber-900 flex items-center"><i className="fa-solid fa-wand-magic-sparkles mr-2 text-amber-500"></i> AI Chalkboard Hook Generator</h3>
                             <p className="text-sm text-amber-700">Need something catchy to write on your physical stall's display board today to attract walk-ins?</p>
                           </div>
                           <button onClick={handleGenerateChalkboard} disabled={isGeneratingChalkboard} className="w-full sm:w-auto bg-white text-amber-700 font-bold py-2 px-4 rounded-xl shadow border border-amber-200 hover:bg-amber-100 transition whitespace-nowrap justify-center flex items-center">
                             {isGeneratingChalkboard ? <i className="fa-solid fa-spinner fa-spin mr-2"></i> : '✨ '} Generate Hook
                           </button>
                         </div>
                         {chalkboardHook && (
                             <div className="bg-white p-6 mt-4 rounded-xl border border-amber-200 text-center relative">
                                  <p className="font-black text-3xl text-gray-800 tracking-tight" style={{fontFamily: 'cursive'}}>{chalkboardHook}</p>
                             </div>
                         )}
                      </div>
                    </div>
                  )}

                </main>
              </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
